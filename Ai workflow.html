<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Omshiv CRM — All 13 AI Agents Lifecycle (Client View)</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    .fade-in { animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
    @media print {
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased p-4 md:p-6">
  <div class="max-w-7xl mx-auto space-y-5">

    <!-- Header -->
    <header class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-4 md:p-5 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div class="space-y-1">
        <div class="flex flex-wrap items-center gap-2">
          <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-[var(--primary)] text-[var(--primary-foreground)]">
            Client Presentation View
          </span>
          <span class="px-2.5 py-0.5 rounded-full text-xs border border-[var(--border)] text-[var(--muted-foreground)]">
            13 Specialized AI Agents
          </span>
        </div>
        <h1 class="text-xl md:text-2xl font-semibold">
          Har AI Agent Kaise Kaam Karta Hai — Complete Lifecycle
        </h1>
        <p class="text-xs md:text-sm text-[var(--muted-foreground)]">
          Simple step-by-step view of every agent's journey: Kab chalu hota hai → Kya check karta hai → Kya kaam karta hai → Result kya aata hai.
        </p>
      </div>

      <div class="flex flex-wrap items-center gap-2 no-print shrink-0">
        <button onclick="setViewMode('single')" id="btnSingle" class="px-3 py-1.5 rounded-lg text-xs font-medium transition">
          1-by-1 Interactive View
        </button>
        <button onclick="setViewMode('all')" id="btnAll" class="px-3 py-1.5 rounded-lg text-xs font-medium transition">
          All 13 Lifecycles (One Page)
        </button>
      </div>
    </header>

    <!-- SINGLE AGENT INTERACTIVE VIEW -->
    <div id="singleView" class="grid grid-cols-1 lg:grid-cols-12 gap-4">
      <!-- Left Selector -->
      <aside class="lg:col-span-4 bg-[var(--card)] border border-[var(--border)] rounded-xl p-3 space-y-2 max-h-[720px] overflow-y-auto">
        <div class="text-xs font-semibold text-[var(--muted-foreground)] px-2 py-1 uppercase tracking-wider">
          Select Any Agent (1 – 13)
        </div>
        <div id="agentList" class="space-y-1.5"></div>
      </aside>

      <!-- Right Lifecycle Canvas -->
      <main class="lg:col-span-8 bg-[var(--card)] border border-[var(--border)] rounded-xl p-5 space-y-5 fade-in" id="agentDetail"></main>
    </div>

    <!-- ALL 13 AT A GLANCE VIEW -->
    <div id="allView" class="hidden space-y-4 fade-in"></div>

  </div>

    let viewMode = "single";
    let selectedIdx = 0;

    function setViewMode(mode) {
      viewMode = mode;
      document.getElementById("singleView").classList.toggle("hidden", mode !== "single");
      document.getElementById("allView").classList.toggle("hidden", mode !== "all");

      document.getElementById("btnSingle").className = mode === "single"
        ? "px-3 py-1.5 rounded-lg text-xs font-medium bg-[var(--primary)] text-[var(--primary-foreground)] transition"
        : "px-3 py-1.5 rounded-lg text-xs font-medium bg-[var(--content)] border border-[var(--border)] text-[var(--muted-foreground)] transition";
      document.getElementById("btnAll").className = mode === "all"
        ? "px-3 py-1.5 rounded-lg text-xs font-medium bg-[var(--primary)] text-[var(--primary-foreground)] transition"
        : "px-3 py-1.5 rounded-lg text-xs font-medium bg-[var(--content)] border border-[var(--border)] text-[var(--muted-foreground)] transition";
    }

    function selectAgent(idx) {
      selectedIdx = idx;
      renderSidebar();
      renderDetail();
    }

    function renderSidebar() {
      const el = document.getElementById("agentList");
      el.innerHTML = AGENTS.map((a, i) => {
        const active = i === selectedIdx;
        return `
          <button onclick="selectAgent(${i})"
            class="w-full text-left p-2.5 rounded-lg border transition flex items-center justify-between gap-2 ${active
              ? "bg-[var(--primary)] text-[var(--primary-foreground)] border-[var(--primary)]"
              : "bg-[var(--content)] text-[var(--foreground)] border-[var(--border)] hover:border-[var(--primary)]"}">
            <div class="min-w-0">
              <div class="text-[11px] font-mono opacity-80">Agent ${a.num}</div>
              <div class="text-xs font-semibold truncate">${a.name}</div>
            </div>
            <span class="text-[11px] opacity-80 shrink-0">→</span>
          </button>
        `;
      }).join("");
    }

    function renderLifecycleMarkup(a, isCompact) {
      return `
        <div class="space-y-4">
          <!-- Title & Summary -->
          <div class="flex flex-wrap items-start justify-between gap-2 border-b border-[var(--border)] pb-3">
            <div>
              <div class="flex flex-wrap items-center gap-2">
                <span class="text-xs font-mono px-2 py-0.5 rounded bg-[var(--content)] border border-[var(--border)]">AGENT ${a.num}</span>
                <span class="text-xs font-medium text-[var(--primary)]">${a.tag}</span>
              </div>
              <h2 class="text-lg font-semibold mt-1">${a.name}</h2>
            </div>
            <span class="text-xs px-2.5 py-1 rounded-full bg-[var(--content)] border border-[var(--border)] text-[var(--muted-foreground)]">
              ${a.languages}
            </span>
          </div>

          <p class="text-sm leading-relaxed">${a.summary}</p>

          <!-- Real-life Example -->
          <div class="bg-[var(--content)] border border-[var(--border)] rounded-lg px-3.5 py-2.5 text-xs">
            <span class="font-semibold text-[var(--primary)]">Real Example:</span> ${a.example}
          </div>

          <!-- 5-Step Lifecycle Flowchart -->
          <div class="space-y-2">
            <div class="text-xs font-semibold uppercase tracking-wider text-[var(--muted-foreground)]">Step-by-Step Lifecycle</div>
            <div class="grid grid-cols-1 md:grid-cols-5 gap-2.5">
              ${a.steps.map((s, idx) => `
                <div class="relative bg-[var(--content)] border border-[var(--border)] rounded-lg p-3 flex flex-col justify-between">
                  <div>
                    <div class="text-xs font-semibold text-[var(--primary)] mb-1">${s.title}</div>
                    <p class="text-xs text-[var(--muted-foreground)] leading-relaxed">${s.desc}</p>
                  </div>
                  ${idx < 4 ? `<div class="hidden md:block text-[11px] font-mono text-[var(--muted-foreground)] mt-2 text-right">Next →</div>` : `<div class="text-[11px] font-mono text-[var(--success)] mt-2 text-right">✓ Done</div>`}
                </div>
              `).join("")}
            </div>
          </div>

          <!-- Safety Rules -->
          <div class="bg-[var(--content)] border border-[var(--border)] rounded-lg p-3 space-y-1.5">
            <div class="text-xs font-semibold">Client Safety Guarantees</div>
            <ul class="space-y-1 text-xs text-[var(--muted-foreground)]">
              ${a.rules.map(r => `<li class="flex items-start gap-2"><span class="text-[var(--success)] font-bold">✓</span><span>${r}</span></li>`).join("")}
            </ul>
          </div>
        </div>
      `;
    }

    function renderDetail() {
      const a = AGENTS[selectedIdx];
      const navButtons = `
        <div class="flex items-center justify-between pt-3 border-t border-[var(--border)]">
          <button onclick="selectAgent(${(selectedIdx - 1 + AGENTS.length) % AGENTS.length})" class="px-3 py-1.5 rounded-lg text-xs border border-[var(--border)] hover:bg-[var(--content)]">
            ← Previous Agent
          </button>
          <span class="text-xs text-[var(--muted-foreground)]">${selectedIdx + 1} of ${AGENTS.length}</span>
          <button onclick="selectAgent(${(selectedIdx + 1) % AGENTS.length})" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-[var(--primary)] text-[var(--primary-foreground)] hover:opacity-90">
            Next Agent →
          </button>
        </div>
      `;
      document.getElementById("agentDetail").innerHTML = renderLifecycleMarkup(a, false) + navButtons;
    }

    function renderAllView() {
      document.getElementById("allView").innerHTML = AGENTS.map(a => `
        <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-5">
          ${renderLifecycleMarkup(a, true)}
        </div>
      `).join("");
    }

    // Init
    setViewMode("single");
    renderSidebar();
    renderDetail();
    renderAllView();
  </script>
</body>
</html>
